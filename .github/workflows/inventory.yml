# Reads the used-inventory listing on a schedule and republishes the label page.
# Nothing has to be installed on the dealership PC: this runs on GitHub, and the
# label page is served from GitHub Pages.
name: Refresh inventory and publish label page

on:
  schedule:
    # Hourly through the working day (UTC; 12:00 UTC = 8am in Kitchener).
    #
    # GitHub runs scheduled workflows on a shared pool: it delays them under load
    # and drops them outright when the load is high enough. On the top of the hour
    # - where most schedules sit - this lot fired 2-4 times a day against a
    # declared 6, between 8 and 125 minutes late. So: an odd minute, away from the
    # crowd, and an hourly slot, so a dropped one costs an hour rather than a day.
    - cron: '37 12-23 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: inventory
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Read the used inventory listing
        id: scrape
        continue-on-error: true
        run: node tools/scrape.mjs

      - name: Report what happened
        run: |
          if [ "${{ steps.scrape.outcome }}" != "success" ]; then
            echo "### Inventory check failed - the last published list is still being served" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f data/inventory.json ]; then
            node -e "const i=require('./data/inventory.json');console.log('| vehicles | new this run | skipped |\n|---|---|---|\n| '+i.counts.printable+' | '+i.counts.newThisRun+' | '+i.counts.incomplete+' |')" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save the refreshed inventory
        if: github.ref_name == github.event.repository.default_branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/inventory.json data/state.json data/site-config.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "Inventory unchanged"
          else
            git commit -m "chore: refresh used inventory [skip ci]"
            git pull --rebase --autostash origin "${{ github.event.repository.default_branch }}"
            git push
          fi

      - name: Assemble the page
        run: |
          mkdir -p _site/data _site/tools/lib
          cp index.html _site/index.html
          cp -r vendor _site/vendor
          if [ -d assets ]; then cp -r assets _site/assets; fi
          cp tools/lib/*.mjs _site/tools/lib/
          if [ -f data/inventory.json ]; then
            cp data/inventory.json _site/data/inventory.json
          else
            # First run before any successful scrape: publish an empty list so the
            # page still loads and the paste-from-website fallback is usable.
            echo '{"fetchedAt":null,"vehicles":[],"incomplete":[],"counts":{"found":0,"printable":0,"incomplete":0,"newThisRun":0},"config":{}}' > _site/data/inventory.json
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Fail the run if the inventory could not be read
        if: steps.scrape.outcome != 'success'
        run: |
          echo "The published page is still being served, but its list is no longer current." >> "$GITHUB_STEP_SUMMARY"
          exit 1

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
